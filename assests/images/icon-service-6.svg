<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Backyard ADU Builds - Detached House with Tree -->
<!-- Main house (background, smaller) -->
<path d="M2 20L8 15L14 20" stroke="#A6A182" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4"/>
<rect x="4" y="20" width="8" height="8" stroke="#A6A182" stroke-width="1.2" fill="none" opacity="0.4"/>
<!-- Fence/path -->
<line x1="14" y1="28" x2="20" y2="28" stroke="#A6A182" stroke-width="1" stroke-dasharray="2 2"/>
<!-- ADU (foreground, larger) -->
<path d="M20 22L28 15L36 22" stroke="#A6A182" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<rect x="22" y="22" width="12" height="10" stroke="#A6A182" stroke-width="1.8" fill="none"/>
<rect x="22" y="22" width="12" height="10" fill="#A6A182" fill-opacity="0.08"/>
<rect x="25" y="25" width="3" height="3" stroke="#A6A182" stroke-width="1" fill="#A6A182" fill-opacity="0.12"/>
<rect x="30" y="25" width="3" height="3" stroke="#A6A182" stroke-width="1" fill="#A6A182" fill-opacity="0.12"/>
<!-- Tree -->
<line x1="18" y1="24" x2="18" y2="32" stroke="#A6A182" stroke-width="1.5"/>
<circle cx="18" cy="20" r="4" fill="#A6A182" fill-opacity="0.15" stroke="#A6A182" stroke-width="1.2"/>
<circle cx="16" cy="18" r="2.5" fill="#A6A182" fill-opacity="0.1" stroke="#A6A182" stroke-width="1"/>
<circle cx="20" cy="18" r="2.5" fill="#A6A182" fill-opacity="0.1" stroke="#A6A182" stroke-width="1"/>
<!-- Ground line -->
<line x1="2" y1="32" x2="38" y2="32" stroke="#A6A182" stroke-width="1.2"/>
</svg>
